name: バグ報告
description: 再現できる不具合を記録します
title: "[不具合] "
body:
  - type: textarea
    id: summary
    attributes:
      label: 不具合の概要
      description: どのゲームや画面で、何が起きますか？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      description: 不具合が起きるまでの操作を順番に書いてください。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作と実際の動作
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: ブラウザー、画面サイズ、キーボード・タッチなど、分かる範囲で記載してください。
    validations:
      required: false
  - type: textarea
    id: tests
    attributes:
      label: 修正後の確認方法
      description: 再発防止の自動テストと、必要な手動確認を書いてください。
    validations:
      required: true
  - type: textarea
    id: roles
    attributes:
      label: 担当・優先度
      description: 依頼者、修正担当、レビュアー、優先度を記載してください。未定の場合は着手時に決めます。
      value: |
        - 依頼者・最終承認者:
        - 修正担当:
        - レビュアー:
        - 優先度:
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### 作業ログ
        作業ログはIssue本文を上書きせず、コメントに追記します。日時、担当と役割、進捗、判断、確認結果、次の作業またはブロッカーを記録してください。
