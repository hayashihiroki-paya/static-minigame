name: 機能・ゲームの作業
description: 新しいゲームや既存機能の変更を管理します
title: "[機能] "
body:
  - type: textarea
    id: purpose
    attributes:
      label: 目的・学習ポイント
      description: 何を実現し、どんなことを学べる作業ですか？
      placeholder: 解決したいことと、学習上のねらいを書いてください。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 仕様・対象範囲
      description: ゲームのルール、操作、開始・終了条件、対象画面などを書いてください。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 作業が完了したと判断できる条件をチェックリストで書いてください。
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: テスト・確認方法
      description: 追加する自動テストと、必要な手動確認を書いてください。
    validations:
      required: true
  - type: textarea
    id: roles
    attributes:
      label: 担当・優先度
      description: 依頼者、実装担当、レビュアー、優先度を記載してください。未定の場合は着手時に決めます。
      value: |
        - 依頼者・最終承認者:
        - 実装担当:
        - レビュアー:
        - 優先度:
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### 作業ログ
        作業ログはIssue本文を上書きせず、コメントに追記します。日時、担当と役割、進捗、判断、確認結果、次の作業またはブロッカーを記録してください。
