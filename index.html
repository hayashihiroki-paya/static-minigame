<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="遊びたいゲームを選んで楽しめるミニゲーム集です。"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <title>static-minigame</title>
  </head>
  <body>
    <!-- メイン画面はゲーム一覧への入口です。新しいゲームを増やすときは、ここに説明とリンクを追加します。 -->
    <main class="page-shell">
      <header class="intro">
        <h1>ミニゲーム集</h1>
        <p class="lead">遊びたいゲームを選んでください。</p>
      </header>
      <!-- ゲームごとのページを独立させ、あとから別の実装方法も並べて試せるようにしています。 -->
      <section class="game-list" aria-labelledby="games-title">
        <h2 id="games-title" class="visually-hidden">遊べるゲーム</h2>
        <article class="game-card">
          <p class="game-card__number" aria-hidden="true">01</p>
          <div class="game-card__content">
            <h3>数字当て</h3>
            <p>ヒントを頼りに、隠された数字を7回以内に当てよう。</p>
          </div>
          <a class="game-card__link" href="./src/games/number-guess/">
            ゲームで遊ぶ
            <span aria-hidden="true">→</span>
          </a>
        </article>
        <article class="game-card">
          <p class="game-card__number" aria-hidden="true">02</p>
          <div class="game-card__content">
            <h3>じゃんけん</h3>
            <p>グー・チョキ・パーを選んで、コンピューターと勝負しよう。</p>
          </div>
          <a class="game-card__link" href="./src/games/rock-paper-scissors/">
            ゲームで遊ぶ
            <span aria-hidden="true">→</span>
          </a>
        </article>
      </section>
      <footer class="site-footer">
        <p>このサイトは学習を目的に作っています。</p>
      </footer>
    </main>
  </body>
</html>
