<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="学びながら遊べる、静的なミニゲーム集です。"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <title>static-minigame</title>
  </head>
  <body>
    <main class="page-shell">
      <header class="intro">
        <p class="eyebrow">PLAY AND LEARN</p>
        <h1>ミニゲーム集</h1>
        <p class="lead">小さなゲームを遊びながら、仕組みも一緒に学べる場所です。</p>
      </header>
      <section class="empty-state" aria-labelledby="empty-title">
        <p class="empty-state__icon" aria-hidden="true">🎮</p>
        <h2 id="empty-title">ゲームを準備中です</h2>
        <p>最初のゲームが追加されると、ここから遊べるようになります。</p>
      </section>
      <footer class="site-footer">
        <p>このサイトは学習を目的に作っています。</p>
      </footer>
    </main>
  </body>
</html>
