<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="30秒でひらがなのお題に答えるタイピングゲームです。" />
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>日本語タイピング | ミニゲーム集</title>
  </head>
  <body>
    <main class="page-shell typing-page">
      <header class="typing-header">
        <a class="back-link" href="../../../index.html">← ゲーム一覧へ</a>
        <h1>日本語タイピング</h1>
        <p class="lead">30秒で、ひらがなのお題にいくつ答えられるかな？</p>
      </header>

      <section class="typing-card" aria-labelledby="typing-title">
        <h2 id="typing-title">タイピングに挑戦</h2>
        <div class="typing-stats">
          <p>残り <strong id="typing-time">30</strong> 秒</p>
          <p>正解 <strong id="typing-score">0</strong> 問</p>
        </div>

        <p class="typing-prompt">お題 <strong id="typing-prompt">—</strong></p>
        <label for="typing-answer">ひらがなで入力</label>
        <p id="typing-help">変換を確定してから、もう一度Enterを押すか「回答する」を押してください。</p>
        <div class="typing-controls">
          <input id="typing-answer" type="text" enterkeyhint="send" autocomplete="off" autocapitalize="none"
            spellcheck="false" aria-describedby="typing-prompt typing-help" disabled />
          <button id="typing-submit" type="button" disabled>回答する</button>
        </div>

        <p id="typing-status" class="typing-status" role="status" aria-live="polite" aria-atomic="true">
          スタートを押すと始まります。
        </p>
        <button id="typing-start" type="button">スタート</button>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
