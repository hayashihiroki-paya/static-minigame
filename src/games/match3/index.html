<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="隣り合うピースを交換して、同じ色を3つ以上そろえるマッチ3パズルです。" />
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>マッチ3パズル | ミニゲーム集</title>
  </head>
  <body>
    <main class="page-shell match3-page">
      <header class="match3-header">
        <a class="back-link" href="../../../index.html">← ゲーム一覧へ</a>
        <h1>マッチ3パズル</h1>
        <p class="lead">隣り合うピースを交換して、同じ色を3つ以上そろえよう。</p>
      </header>

      <section class="match3-card" aria-labelledby="match3-heading">
        <h2 id="match3-heading">8×8の盤面</h2>
        <p class="match3-help">
          マスを一つ選び、隣のマスを選ぶと交換します。横か縦に3つ以上そろうと消え、上のピースが落ちます。キーボードでは矢印キーで移動し、EnterまたはSpaceで選べます。
        </p>

        <p class="match3-chain" aria-live="polite" aria-atomic="true">
          前の手の連鎖：<strong id="match3-chain-count">0</strong>
        </p>

        <div id="match3-board" class="match3-board" role="group" aria-label="8行8列のマッチ3盤面"></div>

        <div class="match3-actions" role="group" aria-label="ゲーム操作">
          <button id="match3-reset" class="match3-reset" type="button">新しい盤面</button>
        </div>

        <p id="match3-feedback" class="match3-feedback" role="status" aria-live="polite" aria-atomic="true">
          マスを選び、隣のマスを選んで交換しましょう。
        </p>
      </section>

      <footer class="site-footer">
        <p>3つ以上並んだピースは同時に消え、落下でそろうと連鎖します。</p>
      </footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
