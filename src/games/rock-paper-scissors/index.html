<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="グー・チョキ・パーを選んでコンピューターと対戦するじゃんけんゲームです。"
    />
    <!-- 共通スタイルとこのゲーム専用スタイルを分け、他のページへの影響を防ぎます。 -->
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>じゃんけん | ミニゲーム集</title>
  </head>
  <body>
    <!-- 戻る導線、対戦操作、結果、累計スコアを1つのmainにまとめます。 -->
    <main class="page-shell rock-paper-scissors-page">
      <header class="rock-paper-scissors-header">
        <a class="back-link" href="../../../index.html">← ゲーム一覧へ</a>
        <h1>じゃんけん</h1>
        <p class="lead">グー・チョキ・パーから手を選んでください。</p>
      </header>

      <section class="rock-paper-scissors-card" aria-labelledby="hand-selection-heading">
        <h2 id="hand-selection-heading">あなたの手</h2>
        <!-- 3つのbuttonを使い、タッチとキーボードの標準操作をどちらも使えるようにします。 -->
        <div class="hand-list">
          <button class="hand-button" type="button" data-hand="rock" aria-label="グーを出す">
            <span class="hand-button__icon" aria-hidden="true">✊</span>
            <span>グー</span>
          </button>
          <button class="hand-button" type="button" data-hand="scissors" aria-label="チョキを出す">
            <span class="hand-button__icon" aria-hidden="true">✌️</span>
            <span>チョキ</span>
          </button>
          <button class="hand-button" type="button" data-hand="paper" aria-label="パーを出す">
            <span class="hand-button__icon" aria-hidden="true">✋</span>
            <span>パー</span>
          </button>
        </div>

        <!-- 結果をライブ領域にまとめ、両者の手と勝敗を操作直後に通知します。 -->
        <p id="round-feedback" class="round-feedback" role="status" aria-live="polite" aria-atomic="true">
          未対戦です。手を選んでください。
        </p>

        <dl class="round-hands" aria-label="直近の対戦">
          <div>
            <dt>あなた</dt>
            <dd id="player-hand">—</dd>
          </div>
          <div>
            <dt>コンピューター</dt>
            <dd id="computer-hand">—</dd>
          </div>
        </dl>

        <section class="score-section" aria-labelledby="score-heading">
          <h2 id="score-heading">累計スコア</h2>
          <!-- 勝敗の各数値をひとまとまりで通知し、どの結果が増えたかも分かるようにします。 -->
          <dl class="score-board" aria-live="polite" aria-atomic="true">
            <div class="score-item">
              <dt>勝ち</dt>
              <dd id="wins-count">0</dd>
            </div>
            <div class="score-item">
              <dt>負け</dt>
              <dd id="losses-count">0</dd>
            </div>
            <div class="score-item">
              <dt>あいこ</dt>
              <dd id="draws-count">0</dd>
            </div>
          </dl>
          <button id="reset-score-button" class="reset-button" type="button">スコアをリセット</button>
        </section>
      </section>

      <footer class="site-footer">
        <p>乱数と条件分岐で勝敗を判定するゲームです。</p>
      </footer>
    </main>

    <!-- このゲーム専用の処理を読み込み、他ゲームの状態と混ぜないようにします。 -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
