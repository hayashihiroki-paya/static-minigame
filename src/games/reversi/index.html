<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="黒石と白石を交互に置いて、相手の石を挟んで裏返すリバーシです。" />
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>リバーシ | ミニゲーム集</title>
  </head>
  <body>
    <!-- 標準ルールの盤面と対局相手の説明をまとめ、初めてでも操作を選べるようにします。 -->
    <main class="page-shell reversi-page">
      <header class="reversi-header">
        <a class="back-link" href="../../../index.html">← ゲーム一覧へ</a>
        <h1>リバーシ</h1>
        <p class="lead">黒石のあなたが先手です。白石のコンピューターと対戦しよう。</p>
      </header>

      <section class="reversi-card" aria-labelledby="reversi-heading">
        <h2 id="reversi-heading">8×8の盤面</h2>
        <div class="reversi-scores" aria-label="石数">
          <p><span class="disc-swatch disc-swatch--black" aria-hidden="true"></span>黒 <strong id="black-score">2</strong></p>
          <p><span class="disc-swatch disc-swatch--white" aria-hidden="true"></span>白 <strong id="white-score">2</strong></p>
        </div>

        <p class="reversi-help" id="control-help">
          緑の印が置ける場所です。マスを押して石を置きます。キーボードでは盤面を選び、矢印キーで移動してEnterまたはSpaceで置けます。
        </p>

        <div
          id="reversi-board"
          class="reversi-board"
          role="grid"
          aria-label="リバーシの8行8列の盤面"
          aria-describedby="control-help game-feedback"
          tabindex="0"
        ></div>

        <div class="reversi-actions" role="group" aria-label="ゲーム操作">
          <button id="restart-button" class="reversi-action-button" type="button">新しい対局</button>
        </div>

        <p id="game-feedback" class="reversi-feedback" role="status" aria-live="polite" aria-atomic="true">
          黒のあなたの番です。置ける場所を選んでください。
        </p>

        <aside class="reversi-learning" aria-label="コンピューターの考え方">
          <h3>コンピューターの考え方</h3>
          <p>
            ミニマックス法で最大4手先まで調べ、石数・角・合法手数から盤面を評価します。αβ枝刈りで、結論に影響しない候補の探索を省きます。
          </p>
        </aside>
      </section>

      <footer class="site-footer">
        <p>相手の石を自分の石で挟むと裏返ります。両者が置けなくなったとき、石が多い方の勝ちです。</p>
      </footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
