<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="4レーンを流れるノーツに合わせて操作するリズムゲームです。" />
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>4レーンリズム | ミニゲーム集</title>
  </head>
  <body>
    <main class="page-shell rhythm-page">
      <header class="rhythm-header">
        <a class="back-link" href="../../../index.html">← ゲーム一覧へ</a>
        <h1>4レーンリズム</h1>
        <p class="lead">ノーツが判定ラインに重なったら、対応する場所を押そう。</p>
      </header>
      <section class="rhythm-card" aria-label="リズムゲーム">
        <p id="rhythm-controls">D・F・J・Kキーか画面下のボタンで操作できます。スタートすると音が鳴ります。</p>
        <div class="rhythm-track" aria-hidden="true">
          <div class="rhythm-lane"></div>
          <div class="rhythm-lane"></div>
          <div class="rhythm-lane"></div>
          <div class="rhythm-lane"></div>
          <div class="rhythm-line"></div>
        </div>
        <div class="rhythm-pad" role="group" aria-label="レーンの操作">
          <button type="button" aria-label="レーン1、D" data-key="d" disabled>D</button>
          <button type="button" aria-label="レーン2、F" data-key="f" disabled>F</button>
          <button type="button" aria-label="レーン3、J" data-key="j" disabled>J</button>
          <button type="button" aria-label="レーン4、K" data-key="k" disabled>K</button>
        </div>
        <p id="rhythm-judgment" class="rhythm-judgment">—</p>
        <dl class="rhythm-counts">
          <div><dt>ぴったり</dt><dd id="rhythm-perfect">0</dd></div>
          <div><dt>少しずれた</dt><dd id="rhythm-good">0</dd></div>
          <div><dt>ミス</dt><dd id="rhythm-miss">0</dd></div>
        </dl>
        <p id="rhythm-status" role="status" aria-live="polite" aria-atomic="true">スタートを押すと始まります。</p>
        <button id="rhythm-start" type="button">スタート</button>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
