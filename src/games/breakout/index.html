<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="パドルでボールを打ち返し、ブロックをすべて消すブロック崩しです。"
    />
    <!-- 共通スタイルとゲーム専用スタイルを読み込み、ほかの画面に影響させません。 -->
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>ブロック崩し | ミニゲーム集</title>
  </head>
  <body>
    <!-- 操作方法、盤面、状態表示を一つのmainにまとめて遊び方を追いやすくします。 -->
    <main class="page-shell breakout-page">
      <header class="breakout-header">
        <a class="back-link" href="../../../index.html">← ゲーム一覧へ</a>
        <h1>ブロック崩し</h1>
        <p class="lead">パドルでボールを打ち返し、ブロックをすべて消そう。</p>
      </header>

      <section class="breakout-card" aria-labelledby="board-heading">
        <h2 id="board-heading">ゲーム画面</h2>

        <!-- Canvasは固定のゲーム座標で描き、CSSだけで画面幅に合わせて縮小します。 -->
        <canvas
          id="game-canvas"
          width="600"
          height="420"
          role="img"
          aria-label="ブロック崩しのゲーム画面"
          aria-describedby="game-feedback control-help"
        >
          このブラウザーはCanvasに対応していません。スコアと操作方法は画面の下に表示します。
        </canvas>

        <!-- 点数と残機はCanvas外にも置き、色や描画だけに情報を頼らないようにします。 -->
        <dl class="breakout-progress">
          <div>
            <dt>得点</dt>
            <dd id="score-output">0</dd>
          </div>
          <div>
            <dt>残機</dt>
            <dd id="lives-output">3</dd>
          </div>
        </dl>

        <!-- ボタンは読み上げやタッチで操作でき、押している間はパドルを動かします。 -->
        <div class="breakout-controls" role="group" aria-label="ゲーム操作">
          <button id="move-left" class="control-button" type="button" data-direction="left">
            ← 左へ
          </button>
          <button id="launch-button" class="control-button control-button--primary" type="button">
            ボールを発射
          </button>
          <button id="move-right" class="control-button" type="button" data-direction="right">
            右へ →
          </button>
        </div>

        <p id="control-help" class="control-help">
          キーボードは左右矢印キーまたはA/Dで移動、Spaceキーで発射できます。タッチ操作では左右ボタンを押し続けてください。
        </p>

        <!-- 進行状態はテキストのライブ領域でも通知し、Canvas以外からも確認できるようにします。 -->
        <p id="game-feedback" class="game-feedback" role="status" aria-live="polite" aria-atomic="true">
          ボールを発射してゲームを始めてください。
        </p>

        <button id="reset-button" class="control-button control-button--secondary" type="button">
          最初から遊ぶ
        </button>
      </section>

      <footer class="site-footer">
        <p>パドルでボールを返し、ブロックを消して得点を獲得するゲームです。</p>
      </footer>
    </main>

    <!-- 入力とCanvas描画を担当する専用モジュールを読み込みます。 -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
