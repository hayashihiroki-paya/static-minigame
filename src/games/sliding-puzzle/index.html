<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="数字タイルを並べ替えて完成させる8パズルです。" />
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>8パズル | ミニゲーム集</title>
  </head>
  <body>
    <!-- 操作盤、移動数、ヒントを一つの画面にまとめて、遊びながら手順を考えられるようにします。 -->
    <main class="page-shell sliding-puzzle-page">
      <header class="sliding-puzzle-header">
        <a class="back-link" href="../../../index.html">← ゲーム一覧へ</a>
        <h1>8パズル</h1>
        <p class="lead">空きマスを使って数字を1から8まで並べよう。</p>
      </header>

      <section class="puzzle-card" aria-labelledby="puzzle-heading">
        <h2 id="puzzle-heading">パズル盤面</h2>
        <p class="puzzle-help">
          空きマスに隣り合うタイルを押すか、矢印キーまたはW・A・S・Dで空きマスを動かします。
        </p>

        <div id="puzzle-board" class="puzzle-board" role="group" aria-label="8パズルの盤面"></div>

        <p class="puzzle-move-count">移動数：<span id="move-count">0</span></p>

        <div class="puzzle-actions" role="group" aria-label="パズル操作">
          <button id="hint-button" class="puzzle-button puzzle-button--hint" type="button">
            最短手順のヒント
          </button>
          <button id="restart-button" class="puzzle-button" type="button">
            新しい盤面
          </button>
        </div>

        <p id="game-feedback" class="puzzle-feedback" role="status" aria-live="polite" aria-atomic="true">
          新しい盤面です。タイルを動かして完成させましょう。
        </p>
      </section>

      <footer class="site-footer">
        <p>ヒントは最短手順の次の一手を案内します。盤面は自分で動かして完成させましょう。</p>
      </footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
