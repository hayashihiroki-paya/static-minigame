<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="「×」と「○」を交互に置き、先に3つ並べるマルバツゲームです。"
    />
    <!-- 共通スタイルと専用スタイルを読み込み、ほかのゲーム画面に影響させません。 -->
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>マルバツゲーム | ミニゲーム集</title>
  </head>
  <body>
    <!-- 戻る導線、手番、盤面、リセットをmainにまとめて対戦の流れを追いやすくします。 -->
    <main class="page-shell tic-tac-toe-page">
      <header class="tic-tac-toe-header">
        <a class="back-link" href="../../../index.html">← ゲーム一覧へ</a>
        <h1>マルバツゲーム</h1>
        <p class="lead">「×」と「○」を交互に置いて、先に3つ並べよう。</p>
      </header>

      <section class="tic-tac-toe-card" aria-labelledby="board-heading">
        <h2 id="board-heading">盤面</h2>

        <p class="turn-indicator">
          次の手番 <strong id="next-mark">×</strong>
        </p>

        <!-- 9個の標準ボタンを並べ、キーボード・タッチ・読み上げに対応します。 -->
        <div id="tic-tac-toe-board" class="tic-tac-toe-board" role="group" aria-label="マルバツゲームの盤面">
          <button class="board-cell" type="button" data-cell-index="0" aria-label="1行1列目、空き" aria-pressed="false"></button>
          <button class="board-cell" type="button" data-cell-index="1" aria-label="1行2列目、空き" aria-pressed="false"></button>
          <button class="board-cell" type="button" data-cell-index="2" aria-label="1行3列目、空き" aria-pressed="false"></button>
          <button class="board-cell" type="button" data-cell-index="3" aria-label="2行1列目、空き" aria-pressed="false"></button>
          <button class="board-cell" type="button" data-cell-index="4" aria-label="2行2列目、空き" aria-pressed="false"></button>
          <button class="board-cell" type="button" data-cell-index="5" aria-label="2行3列目、空き" aria-pressed="false"></button>
          <button class="board-cell" type="button" data-cell-index="6" aria-label="3行1列目、空き" aria-pressed="false"></button>
          <button class="board-cell" type="button" data-cell-index="7" aria-label="3行2列目、空き" aria-pressed="false"></button>
          <button class="board-cell" type="button" data-cell-index="8" aria-label="3行3列目、空き" aria-pressed="false"></button>
        </div>

        <!-- 手番・勝敗・引き分けを一つのライブ領域で知らせます。 -->
        <p id="game-feedback" class="game-feedback" role="status" aria-live="polite" aria-atomic="true">
          ×の番です。空いているマスを選んでください。
        </p>

        <button id="reset-button" class="reset-button" type="button">最初から遊ぶ</button>
      </section>

      <footer class="site-footer">
        <p>縦・横・斜めのいずれかに、同じ記号を3つ並べるゲームです。</p>
      </footer>
    </main>

    <!-- ゲーム専用の画面処理だけを読み込み、状態更新は別モジュールに分けます。 -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
