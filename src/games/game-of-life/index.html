<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="生命セルを並べ、ライフゲームの世代変化を試そう。" />
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>ライフゲーム | ミニゲーム集</title>
  </head>
  <body>
    <!-- 初期配置、世代操作、現在の生存数を一画面で確認できるようにします。 -->
    <main class="page-shell life-page">
      <header class="life-header">
        <a class="back-link" href="../../../index.html">← ゲーム一覧へ</a>
        <h1>ライフゲーム</h1>
        <p class="lead">セルを並べて、世代ごとに変化する模様を観察しよう。</p>
      </header>

      <section class="life-card" aria-labelledby="life-heading">
        <h2 id="life-heading">20×20の盤面</h2>

        <div class="life-stats" aria-label="盤面の状態">
          <p>世代 <strong id="generation-count">0</strong></p>
          <p>生存セル <strong id="live-count">0</strong></p>
        </div>

        <p id="control-help" class="life-help">
          セルを押すと生死が切り替わります。キーボードは盤面に入り、矢印キーで移動、EnterまたはSpaceで切り替えます。自動進行中はセルを編集できません。
        </p>

        <div class="life-board-scroll" aria-label="盤面のスクロール領域">
          <div
            id="life-board"
            class="life-board"
            role="grid"
            aria-label="ライフゲームの20行20列の盤面"
            aria-describedby="control-help game-feedback"
            tabindex="0"
          ></div>
        </div>

        <div class="life-actions" role="group" aria-label="世代操作">
          <button id="step-button" class="life-button life-button--secondary" type="button">
            1世代進める
          </button>
          <button id="run-button" class="life-button life-button--primary" type="button" aria-pressed="false">
            自動進行を始める
          </button>
          <button id="reset-button" class="life-button life-button--secondary" type="button">
            初期化
          </button>
        </div>

        <p id="game-feedback" class="life-feedback" role="status" aria-live="polite" aria-atomic="true">
          セルを配置して「1世代進める」か、自動進行を始めてください。
        </p>

        <aside class="life-rules" aria-label="世代更新のルール">
          <h3>世代更新のルール</h3>
          <p>生存セルは近傍が2個または3個なら残り、死亡セルは近傍がちょうど3個なら生まれます。盤面の外側は死亡セルです。</p>
        </aside>
      </section>

      <footer class="site-footer">
        <p>次の世代は現在の盤面全体から計算されます。セルを更新する順番で結果は変わりません。</p>
      </footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
